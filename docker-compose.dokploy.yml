# Dokploy deployment.
#
# In Dokploy: create an application → Compose type → point it at this file, then set the
# variables below under the app's "Environment" tab. They are injected at runtime and are
# never baked into the image (.dockerignore excludes .env and *.local).
#
# Required: MONGODB_URI, JWT_SECRET. Everything else is optional.
#
# APP_DOMAIN overrides the hostname Traefik routes; it defaults to the production one below
# because Dokploy regenerates .env on every deploy, and an unset variable rendered as
# Host(``) — a rule that matches nothing, so Traefik falls through to its default 404.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: bolt-ai-production
    restart: unless-stopped

    # The image runs `node server.mjs` (one pooled MongoDB connection per container), a single
    # Node.js process - it does not use multiple cores on its own. Running replicas is what actually puts a multi-core
    # box's other cores to work; Traefik round-robins across every container matching the
    # labels below automatically, no config needed on its side. Assumes nothing else heavy
    # shares this host - if MongoDB or another app also runs here, lower these numbers so
    # you don't starve them. Low CPU with slow responses means requests are waiting on I/O
    # (MongoDB connects, LLM APIs), not CPU — more replicas won't fix that.
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: '1.5'
          memory: 4g
        reservations:
          cpus: '1'
          memory: 2g

    # Not published to the host. Traefik reaches the container over dokploy-network, so a
    # host port mapping would only add a plain-HTTP way in that bypasses TLS entirely.
    expose:
      - '5173'
    environment:
      NODE_ENV: production
      RUNNING_IN_DOCKER: 'true'
      PORT: '5173'

      # Matches the 4 physical cores available - lets Node's libuv thread pool (used for
      # file system and DNS work) actually use them instead of the 4-thread default that
      # was really a guess unrelated to this box's core count.
      UV_THREADPOOL_SIZE: '4'

      # --- Required -------------------------------------------------------------
      # The server throws on any request if these are unset. No defaults on purpose:
      # a fallback secret is worse than a loud failure.
      MONGODB_URI: ${MONGODB_URI:?MONGODB_URI must be set in the Dokploy environment}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in the Dokploy environment}

      # --- LLM providers (set only the ones you use) ----------------------------
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPEN_ROUTER_API_KEY: ${OPEN_ROUTER_API_KEY:-}
      GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      PERPLEXITY_API_KEY: ${PERPLEXITY_API_KEY:-}
      TOGETHER_API_KEY: ${TOGETHER_API_KEY:-}
      TOGETHER_API_BASE_URL: ${TOGETHER_API_BASE_URL:-}
      TOKENGO_API_KEY: ${TOKENGO_API_KEY:-}
      TOKENGO_API_BASE_URL: ${TOKENGO_API_BASE_URL:-}
      OPENAI_LIKE_API_KEY: ${OPENAI_LIKE_API_KEY:-}
      OPENAI_LIKE_API_BASE_URL: ${OPENAI_LIKE_API_BASE_URL:-}
      OLLAMA_API_BASE_URL: ${OLLAMA_API_BASE_URL:-}
      LMSTUDIO_API_BASE_URL: ${LMSTUDIO_API_BASE_URL:-}
      AWS_BEDROCK_CONFIG: ${AWS_BEDROCK_CONFIG:-}
      TOKENGO_REASONING_EFFORT: ${TOKENGO_REASONING_EFFORT:-}

      # --- Shared integration credentials ----------------------------------------
      # Dokploy's Environment tab only feeds ${...} interpolation in this file — a variable
      # not listed here never reaches the container, and the app reports "No github
      # credentials are configured". Settings → Connections overrides all of these.
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_ACCESS_TOKEN: ${GITHUB_ACCESS_TOKEN:-}
      SUPABASE_ACCESS_TOKEN: ${SUPABASE_ACCESS_TOKEN:-}
      VERCEL_TOKEN: ${VERCEL_TOKEN:-}
      NETLIFY_TOKEN: ${NETLIFY_TOKEN:-}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}

      # --- Remote preview (Vercel Sandbox) ----------------------------------------
      # With VERCEL_TOKEN plus these two set, npm install and dev servers run in a Vercel
      # Sandbox instead of the user's browser. Leave unset to keep in-browser previews.
      VERCEL_TEAM_ID: ${VERCEL_TEAM_ID:-}
      VERCEL_PROJECT_ID: ${VERCEL_PROJECT_ID:-}
      VERCEL_SANDBOX_REGION: ${VERCEL_SANDBOX_REGION:-syd1}

      # --- Misc -----------------------------------------------------------------
      VITE_LOG_LEVEL: ${VITE_LOG_LEVEL:-info}
      DEFAULT_NUM_CTX: ${DEFAULT_NUM_CTX:-32768}

    healthcheck:
      test:
        - CMD
        - node
        - '-e'
        - "fetch('http://127.0.0.1:5173/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s

      # Give the container room to boot before failures count against it.
      start_period: 60s
      retries: 3

    extra_hosts:
      - 'host.docker.internal:host-gateway'

    # Routing is declared here rather than in Dokploy's "Domains" tab. The tab writes the
    # same labels into a generated override, but only regenerates them on deploy — which is
    # the usual source of a 404: Traefik is reachable, no router matches the Host, so it
    # falls through to its default 404 handler. Labels in the compose file cannot drift.
    #
    # Names are project-scoped ("sitara-builder") because Traefik router and service names
    # share one namespace across every app on this host.
    labels:
      - 'traefik.enable=true'

      # The container sits on one network here, but Traefik still refuses to guess when a
      # container is multi-homed. Being explicit costs nothing and removes a failure mode.
      - 'traefik.docker.network=dokploy-network'

      # HTTPS.
      - 'traefik.http.routers.sitara-builder.rule=Host(`${APP_DOMAIN:-builder.d2media.com.au}`)'
      - 'traefik.http.routers.sitara-builder.entrypoints=websecure'
      - 'traefik.http.routers.sitara-builder.tls=true'
      - 'traefik.http.routers.sitara-builder.tls.certresolver=letsencrypt'
      - 'traefik.http.routers.sitara-builder.service=sitara-builder'

      # Port 80 carries the ACME HTTP-01 challenge, then redirects. Dropping this router
      # entirely would break certificate renewal, not just the redirect.
      - 'traefik.http.routers.sitara-builder-web.rule=Host(`${APP_DOMAIN:-builder.d2media.com.au}`)'
      - 'traefik.http.routers.sitara-builder-web.entrypoints=web'
      - 'traefik.http.routers.sitara-builder-web.middlewares=sitara-builder-https'
      - 'traefik.http.middlewares.sitara-builder-https.redirectscheme.scheme=https'

      # Which container port to forward to. Omitting this is the other common 404/502:
      # Traefik picks an arbitrary exposed port when the service does not name one.
      - 'traefik.http.services.sitara-builder.loadbalancer.server.port=5173'

    # Dokploy's Traefik proxy reaches containers over this network. Without joining it the
    # container runs and reports healthy while the domain returns 502/404, because Traefik
    # has no route to it.
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true
